name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        required: false
        description: "Reason for running this workflow"
      use_test_image:
        required: false
        type: boolean
        description: "Use base image testpr"
        default: false
      base_variant:
        required: false
        type: string
        description: "Debian codename to build on the next-release base images (e.g. forky). Blank builds on stable."
        default: ""

env:
  GHCR_IMAGE: sdr-enthusiasts/docker-tar1090
  GHCR_REGISTRY: ghcr.io
  GH_LABEL: main
  GHCR_TAG: telegraf

jobs:
  workflow-dispatch:
    name: Triggered via Workflow Dispatch?
    # only run this step if workflow dispatch triggered
    # log the reason the workflow dispatch was triggered
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.reason != ''
    runs-on: ubuntu-26.04
    steps:
      - name: Log dispatch reason
        env:
          INPUTS_REASON: ${{ github.event.inputs.reason }}
          INPUTS_USE_TEST_IMAGE: ${{ github.event.inputs.use_test_image }}
          INPUTS_BASE_VARIANT: ${{ github.event.inputs.base_variant }}
        run: |
          echo "Workflow dispatch reason: $INPUTS_REASON"
          echo "Use test image: $INPUTS_USE_TEST_IMAGE"
          echo "Base variant: ${INPUTS_BASE_VARIANT:-none (stable)}"

  deploy:
    name: Deploy without telegraf
    uses: sdr-enthusiasts/common-github-workflows/.github/workflows/sdre.yml@6fe78a4f1b7ab06ae480c7d2bb304f3a6c39055b # main
    with:
      push_enabled: true
      push_destinations: ghcr.io
      ghcr_repo_owner: ${{ github.repository_owner }}
      ghcr_repo: ${{ github.repository }}
      # set build_latest to true if github.event.inputs.use_test_image is false
      build_latest: ${{ github.event.inputs.use_test_image == 'false' || github.event.inputs.use_test_image == '' }}
      build_baseimage_test: ${{ github.event.inputs.use_test_image == 'true' }}
      build_baseimage_url: wreadsb/wreadsb-test-pr
      base_variant: ${{ github.event.inputs.base_variant }}
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}
  deploy_with_telegraf:
    name: Deploy with telegraf and healthcheck
    uses: sdr-enthusiasts/common-github-workflows/.github/workflows/sdre.yml@6fe78a4f1b7ab06ae480c7d2bb304f3a6c39055b # main
    with:
      push_enabled: true
      push_destinations: ghcr.io
      ghcr_repo_owner: ${{ github.repository_owner }}
      ghcr_repo: ${{ github.repository }}
      # set build_latest to true if github.event.inputs.use_test_image is false
      build_latest: ${{ github.event.inputs.use_test_image == 'false' || github.event.inputs.use_test_image == '' }}
      build_baseimage_test: ${{ github.event.inputs.use_test_image == 'true' }}
      build_baseimage_url: wreadsb/wreadsb-test-pr
      docker_latest_tag: telegraf
      dockerfile_changes: |
        ##telegraf##/
      base_variant: ${{ github.event.inputs.base_variant }}
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  trigger_build_sdr-enthusiasts_ultrafeeder:
    name: Trigger deploy of sdr-enthusiasts/docker-adsb-ultrafeeder
    needs: ["deploy", "deploy_with_telegraf"]
    runs-on: ubuntu-26.04
    env:
      WORKFLOW_AUTH_TOKEN: ${{ secrets.GH_PAT_KX1T }}
      WORKFLOW_REPO: sdr-enthusiasts/docker-adsb-ultrafeeder
      WORKFLOW_FILE: deploy.yml
      WORKFLOW_REASON: "triggered via deploy.yml in sdr-enthusiasts/docker-tar1090"
      WORKFLOW_TEST_IMAGE: ${{ github.event.inputs.use_test_image }}
      WORKFLOW_BASE_VARIANT: ${{ github.event.inputs.base_variant }}
    steps:
      - name: Trigger ${{ env.WORKFLOW_FILE }} in ${{ env.WORKFLOW_REPO }}
        run: |
          echo "$WORKFLOW_AUTH_TOKEN" | gh auth login --with-token
          fields=(-f reason="$WORKFLOW_REASON" -f use_test_image="$WORKFLOW_TEST_IMAGE")
          # A next-release build of tar1090 rebuilds ultrafeeder on the same release.
          if [[ -n "$WORKFLOW_BASE_VARIANT" ]]; then
            fields+=(-f base_variant="$WORKFLOW_BASE_VARIANT")
          fi
          gh workflow run --ref main --repo "$WORKFLOW_REPO" "$WORKFLOW_FILE" "${fields[@]}"
